<!DOCTYPE html>
<html lang="zh-CN">
<head>
<title>图片已屏蔽 | K-Vault</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="apple-touch-icon" href="/logo.png">
  <link rel="shortcut icon" href="/favicon.ico">
  <link rel="stylesheet" href="/theme.css">
  <script src="/theme.js?v=20260305"></script>
<meta charset="UTF-8">
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<meta http-equiv="X-UA-Compatible" content="IE=Edge">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free/css/all.min.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  body {
    min-height: 100vh;
    background: var(--ui-page-bg);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans SC', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  
  .container {
    background: #ffffff;
    border-radius: var(--radius-lg);
    padding: 48px 40px;
    max-width: 500px;
    text-align: center;
    box-shadow: var(--shadow-1);
    border: 1px solid rgba(var(--ui-border-rgb), 0.46);
    animation: fadeIn 0.2s ease-out;
  }
  
  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }
  
  .icon {
    width: 80px;
    height: 80px;
    background: #f56c6c;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 24px;
    font-size: 2.5em;
    color: white;
    box-shadow: 0 1px 2px rgba(15, 23, 42, 0.06);
  }
  
  .title {
    font-size: 1.5em;
    font-weight: 700;
    color: #333;
    margin-bottom: 16px;
  }
  
  .message {
    color: #666;
    line-height: 1.8;
    margin-bottom: 24px;
    font-size: 0.95em;
  }
  
  .message-en {
    color: #999;
    font-size: 0.85em;
    margin-bottom: 32px;
  }
  
  .footer {
    color: #999;
    font-size: 0.85em;
  }
  
  .footer a {
    color: #8a4bff;
    text-decoration: none;
    font-weight: 500;
    transition: color 180ms ease-out;
  }
  
  .footer a:hover {
    text-decoration: underline;
  }
  
  .back-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 12px 24px;
    background: #8a4bff;
    color: white;
    border: none;
    border-radius: var(--radius-sm);
    font-size: 0.95em;
    font-weight: 500;
    cursor: pointer;
    transition: background-color 180ms ease-out;
    text-decoration: none;
    margin-bottom: 24px;
  }
  
  .back-btn:hover {
    background: #7a3df0;
  }
</style>
<link rel="stylesheet" href="/mobile-refactor.css">
</head>
<body>
  <div class="container">
    <div class="icon">
      <i class="fas fa-ban"></i>
    </div>
    <h1 class="title">图片已屏蔽</h1>
    <p class="message">
      抱歉，当前图片未能通过审查，可能含有不良内容，故无法加载显示。
    </p>
    <p class="message-en">
      Sorry, this image failed content review and cannot be displayed.
    </p>
    <a href="javascript:history.back()" class="back-btn">
      <i class="fas fa-arrow-left"></i>
      返回上一页
    </a>
    <p class="footer">
      Powered by <a href="https://github.com/katelya77/K-Vault">K-Vault</a>
    </p>
  </div>
</body>
</html>
