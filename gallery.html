<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>图片浏览器 | YoruVault</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="apple-touch-icon" href="/logo.png">
  <link rel="shortcut icon" href="/favicon.ico">
  <!-- Vue 仍走 CDN：提前建连，省掉 DNS + TLS 往返。 -->
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="/theme.css?v=a75cddd38a">
  <script src="/theme-core.js?v=0df3ba0224"></script>
  <script src="/accent-color.js?v=35dbe085ce"></script>
  <script defer src="/theme-effects.js?v=1855979437"></script>
  <link rel="stylesheet" href="/ui-buttons.css?v=55f77f600e">
  <!-- 应用外壳（顶栏）各分区页共用，因此排在页面私有样式之前。 -->
  <link rel="stylesheet" href="/app-shell.css?v=5b3d173054">
  <link rel="stylesheet" href="/shell-panels.css?v=eae6725420">
  <link rel="stylesheet" href="/gallery.css?v=b4d4649db3">
<script src="/kv-shared.js?v=f480f6145a"></script>
  <link rel="stylesheet" href="/mobile-refactor.css?v=f5c563939c">
</head>
<body>
  <!-- 应用外壳顶栏：与其它分区页逐字相同。
       此前这里是另一套 .header（标题「图片浏览器」+ 上传/管理/首页 + 页面级
       主题按钮），点进来像换了个站。现在只有分区内容不同，外壳一致。

       放在 #app 外面：顶栏是全宽的应用外框，而 #app 是带宽度的内容容器，
       嵌进去会被压成和内容同宽。主题按钮用 data-theme-toggle，由
       theme-core.js 绑定并维护图标/文案（由 theme-core.js 统一维护）。 -->
  <header class="workspace-header">
    <a class="workspace-brand" href="./" aria-label="YoruVault 上传首页">
      <img src="/logo.png" alt="" width="32" height="32">
      <span>YoruVault</span>
    </a>
    <nav class="workspace-nav" aria-label="全局导航">
      <a href="./">上传</a>
      <a href="./admin.html">文件</a>
      <a href="./gallery.html" aria-current="page">图库</a>
      <a href="./video.html">视频</a>
    </nav>
    <div class="workspace-tools">
      <button type="button" class="workspace-tool" data-theme-toggle aria-label="切换主题">
        <i data-lucide="moon" data-theme-icon></i>
        <span data-theme-label>夜间</span>
      </button>
      <button type="button" class="workspace-tool workspace-tool-icon" data-shell-tool="connection" title="系统连接状态" aria-label="系统连接状态"><i data-lucide="activity"></i></button>
      <button type="button" class="workspace-tool workspace-tool-icon" data-shell-tool="design" title="UI 设计设置" aria-label="UI 设计设置"><i data-lucide="palette"></i></button>
      <button type="button" class="workspace-tool" data-shell-logout title="退出登录" aria-label="退出登录">
        <i data-lucide="log-out"></i><span>退出</span>
      </button>
    </div>
  </header>

  <div id="app" v-cloak>
    <!-- 工具栏 -->
    <div class="toolbar">
      <div class="toolbar-left">
        <label class="files-search-label" for="gallery-search">搜索文件</label>
        <div class="header-search">
          <input id="gallery-search" type="text" v-model="searchQuery" placeholder="搜索文件名..." @input="handleSearch">
        </div>
        <!-- totalCount 取的是 searchedImages.length，也就是**搜索过滤之后**的图片数，
             与网格里看到的严格一致。搜索时它会跟着变，这正是"总数"该有的
             行为：用户看到的每一个数字都描述他此刻屏幕上看到的东西。
             标签跟着语义走：搜索时叫"匹配"，平时叫"总数"。 -->
        <span class="stat-badge">
          <i data-lucide="images"></i>
          <template v-if="searchQuery.trim()">匹配<strong>{{ totalCount }}</strong></template>
          <template v-else>图片<strong>{{ totalCount }}</strong></template>
        </span>
        <span class="stat-badge"><i data-lucide="square-check"></i> 已选<strong>{{ selectedCount }}</strong></span>
        <button class="btn btn-sm btn-ghost" @click="selectAll">
          <kv-icon :name="isAllSelected ? 'square-check' : 'square'"></kv-icon>
          <span>{{ isAllSelected ? '取消全选' : '全选' }}</span>
        </button>
        <button class="btn btn-sm btn-ghost" @click="loadMore" v-if="hasMore" :disabled="loading">
          <i data-lucide="refresh-cw" :class="{ 'spin': loading }"></i>
          <span>加载更多</span>
        </button>
      </div>
      <div class="toolbar-right">
        <!-- 布局切换。瀑布流曾是一个独立页面（admin-waterfall.html），
             它的独有价值只有 column-count 排版，其余功能都被图库覆盖，
             所以并进来当视图开关而不是保留第二个页面。 -->
        <span class="format-label" aria-hidden="true">布局</span>
        <div class="segmented" role="group" aria-label="图片布局">
          <button class="btn" :aria-pressed="viewMode === 'grid' ? 'true' : 'false'"
                  title="等宽方格" @click="viewMode = 'grid'">
            <i data-lucide="layout-grid"></i><span>方格</span>
          </button>
          <button class="btn" :aria-pressed="viewMode === 'masonry' ? 'true' : 'false'"
                  title="按原始比例竖排，高度随图片" @click="viewMode = 'masonry'">
            <i data-lucide="waves-ladder"></i><span>瀑布流</span>
          </button>
        </div>
        <!-- 每种格式的实际产物写在 title 里，复制前就能看清会得到什么。 -->
        <span class="format-label" aria-hidden="true">复制格式</span>
        <div class="segmented" role="group" aria-label="复制链接的格式">
          <button class="btn" :aria-pressed="linkFormat === 'url' ? 'true' : 'false'"
                  title="只复制直链地址"
                  @click="linkFormat = 'url'">直链</button>
          <button class="btn" :aria-pressed="linkFormat === 'markdown' ? 'true' : 'false'" @click="linkFormat = 'markdown'">MD</button>
          <button class="btn" :aria-pressed="linkFormat === 'html' ? 'true' : 'false'" @click="linkFormat = 'html'">HTML</button>
          <button class="btn" :aria-pressed="linkFormat === 'bbcode' ? 'true' : 'false'" @click="linkFormat = 'bbcode'">BB</button>
        </div>
      </div>
    </div>

    <!-- 图片网格。
     viewMode 只切换布局，不切换数据：两种视图渲染同一批卡片、同一套
     选择/复制/删除，所以切换视图不会丢选中态。原先瀑布流是
     admin-waterfall.html 这个独立页面，与图库功能重叠却少了选择、
     复制链接、删除，还自带一份过期的图片清单 —— 并进来之后这些都共用。 -->
    <div class="image-grid"
         :class="{ 'is-masonry': viewMode === 'masonry' }"
         v-if="!loading || images.length > 0">
      <div class="image-card"
           v-for="(img, index) in filteredImages"
           :key="img.name"
           :class="{ selected: img.selected, 'is-unviewable': !canView(img) }"
           @click="toggleSelect(img)">
        <!-- 能解码的走 <img>；RAW / PSD / tiff / heic / jxl 是图片但浏览器
             画不出来，给一张碎图毫无意义，改用占位卡 + 格式名。
             这是 isImageName（归类，宽）与 isViewableImage（渲染，窄）的
             分界在界面上的落点。 -->
        <img v-if="canView(img)"
             :src="'/file/' + img.name"
             :alt="img.metadata?.fileName || img.name"
             loading="lazy"
             @error="handleImageError($event, img)">
        <div v-else class="image-card-placeholder" role="img"
             :aria-label="'浏览器无法预览的 ' + extOf(img.name) + ' 图片'">
          <i data-lucide="image-off"></i>
          <span class="image-card-format">{{ extOf(img.name).toUpperCase() }}</span>
          <span class="image-card-format-hint">浏览器无法预览</span>
        </div>
        <div class="image-card-checkbox"
             :class="{ checked: img.selected }"
             @click.stop="toggleSelect(img)">
          <kv-icon :name="img.selected ? 'check' : 'square'"></kv-icon>
        </div>
        <div class="image-card-overlay">
          <div class="image-card-name">{{ img.metadata?.fileName || img.name }}</div>
          <div class="image-card-actions">
            <button class="btn btn-sm btn-icon" @click.stop="copyLink(img)" title="复制链接" aria-label="复制链接">
              <i data-lucide="copy"></i>
            </button>
            <button v-if="canView(img)" class="btn btn-sm btn-icon" @click.stop="previewImage(img)" title="预览" aria-label="预览">
              <i data-lucide="expand"></i>
            </button>
            <button class="btn btn-sm btn-icon" @click.stop="downloadImage(img)" title="下载" aria-label="下载">
              <i data-lucide="download"></i>
            </button>
            <button class="btn btn-sm btn-icon" @click.stop="deleteImage(img, index)" title="删除" aria-label="删除">
              <i data-lucide="trash"></i>
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- 加载状态 -->
    <div class="loading-state" v-if="loading && images.length === 0">
      <div class="loading-spinner"></div>
      <div>加载中...</div>
    </div>

    <!-- 空状态。

         分两种，因为它们要用户做的事完全不同：
           图片库里一张图都没有  -> 去上传（附一个"清理占位文件"的入口，
                                 因为最常见的成因就是存了非图片文件）
           有图但搜索没匹配上      -> 换个搜索词，"去上传"在这里是误导
         此前两种情况共用一个文案，搜索无结果时却让用户去上传，方向是错的。 -->
    <div class="empty-state" v-if="!loading && filteredImages.length === 0">
      <i data-lucide="inbox"></i>
      <template v-if="searchQuery.trim()">
        <div style="font-size: 1.2em; margin-bottom: 8px;">没有匹配的图片</div>
        <div>试试其他搜索词，或清空搜索查看全部 {{ imageItems.length }} 张</div>
        <button class="btn" type="button" style="margin-top: 20px;" @click="searchQuery = ''">
          <i data-lucide="x"></i><span>清空搜索</span>
        </button>
      </template>
      <template v-else>
        <div style="font-size: 1.2em; margin-bottom: 8px;">这里还没有图片</div>
        <div>上传图片后会出现在这里</div>
        <a href="./" class="btn btn-primary" style="margin-top: 20px;">
          <i data-lucide="cloud-upload"></i><span>去上传</span>
        </a>
      </template>
    </div>

    <!-- 分页 -->
    <div class="pagination" v-if="totalPages > 1">
      <button class="btn btn-sm btn-icon" @click="currentPage = 1" :disabled="currentPage === 1" aria-label="第一页">
        <i data-lucide="chevrons-left"></i>
      </button>
      <button class="btn btn-sm btn-icon" @click="currentPage--" :disabled="currentPage === 1" aria-label="上一页">
        <i data-lucide="chevron-left"></i>
      </button>
      <template v-for="page in displayPages">
        <button class="btn btn-sm" :class="{ 'is-active': page === currentPage }" @click="currentPage = page" :key="page">
          {{ page }}
        </button>
      </template>
      <button class="btn btn-sm btn-icon" @click="currentPage++" :disabled="currentPage === totalPages" aria-label="下一页">
        <i data-lucide="chevron-right"></i>
      </button>
      <button class="btn btn-sm btn-icon" @click="currentPage = totalPages" :disabled="currentPage === totalPages" aria-label="末页">
        <i data-lucide="chevrons-right"></i>
      </button>
    </div>

    <!-- 批量操作栏 -->
    <div class="batch-bar" v-if="selectedCount > 0">
      <div class="batch-bar-count">已选择 <strong>{{ selectedCount }}</strong> 个文件</div>
      <button class="btn btn-sm btn-primary" @click="batchCopy">
        <i data-lucide="copy"></i><span>复制链接</span>
      </button>
      <button class="btn btn-sm btn-ghost" @click="batchDownload">
        <i data-lucide="download"></i><span>下载</span>
      </button>
      <button class="btn btn-sm btn-danger" @click="batchDelete">
        <i data-lucide="trash"></i><span>删除</span>
      </button>
      <button class="btn btn-sm btn-quiet" @click="clearSelection">
        <i data-lucide="x"></i><span>取消</span>
      </button>
    </div>

    <!-- 预览弹窗 - 原生图片 / iframe 预览 -->
    <div class="preview-modal" v-if="previewData" @click="closePreview">
      <button class="btn btn-icon preview-close" @click="closePreview" aria-label="关闭预览">
        <i data-lucide="x"></i>
      </button>
      <!-- 原生图片预览 -->
      <img v-if="previewData.type === 'native-image'" :src="previewData.url" @click.stop>
      <!-- iframe 预览（视频/音频/文档） -->
      <div v-else-if="previewData.type === 'iframe'" class="iframe-container" @click.stop>
        <iframe 
          ref="previewIframe"
          :src="previewData.iframeUrl"
          allow="autoplay; fullscreen; encrypted-media"
          allowfullscreen>
        </iframe>
      </div>
      <div class="preview-info" @click.stop>
        <span class="preview-link">{{ previewData.url }}</span>
        <button class="btn btn-sm btn-primary" @click="copyPreviewLink">
          <i data-lucide="copy"></i><span>复制</span>
        </button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/vue@2.6.14/dist/vue.min.js" integrity="sha384-ULpZhk1pvhc/UK5ktA9kwb2guy9ovNSTyxPNHANnA35YjBQgdwI+AhLkixDvdlw4" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <!-- 必须在下面 new Vue 之前：icons.js 用 Vue.mixin 注册渲染钩子，而 Vue.mixin
       只作用于之后创建的实例。放在后面的话 v-if 里的图标永远不会被替换。 -->
  <script src="/icons-subset.js?v=5d9a5603cc"></script>
  <script src="/icons.js?v=fc3fc216e0"></script>
  <script src="/shell-tools.js?v=12d11bbbd2"></script>
  <script src="/gallery-app.js?v=e81cc7cf03"></script>
</body>
</html>
