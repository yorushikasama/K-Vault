<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>文件预览 | YoruVault</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="apple-touch-icon" href="/logo.png">
  <link rel="shortcut icon" href="/favicon.ico">
  <!-- 增强预览引擎按需从 unpkg 加载：提前建连，省掉 DNS + TLS 往返。 -->
  <link rel="preconnect" href="https://unpkg.com" crossorigin>
  <link rel="stylesheet" href="/theme.css?v=384f4cd816">
  <link rel="stylesheet" href="/ui-buttons.css?v=ed3255da55">
  <link rel="stylesheet" href="/preview.css?v=f79dac5d95">
<script src="/kv-shared.js?v=f480f6145a"></script>
  <link rel="stylesheet" href="/mobile-refactor.css?v=cc42653903">
  <!-- 预览页此前是全站唯一没加载 theme-core.js 的页面。没有它就没有
       ThemeManager，data-theme 永远是 null，于是 preview.css 里
       html[data-theme="dark"] 的规则一条都不会命中——夜间模式在这里完全
       失效（实测两模式 body 背景同色）。它必须同步放在 <head>：首帧前把
       data-theme 写到 <html> 上，延后会闪一下白屏。 -->
  <script src="/theme-core.js?v=0df3ba0224"></script>
  <script src="/accent-color.js?v=35dbe085ce"></script>
  <script defer src="/theme-effects.js?v=d231ac575a"></script>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="title-group">
        <h1>文件预览</h1>
        <p id="subtitle">YoruVault 本地预览器</p>
      </div>
      <div class="actions">
        <button class="btn btn-ghost" type="button" data-theme-toggle aria-label="切换主题">
          <i data-lucide="moon" data-theme-icon aria-hidden="true"></i><span data-theme-label>夜间</span>
        </button>
        <button class="btn btn-ghost" type="button" id="copyBtn">复制直链</button>
        <button class="btn btn-ghost" type="button" id="openBtn">新标签打开</button>
        <button class="btn btn-primary" type="button" id="downloadBtn">下载文件</button>
      </div>
    </header>

    <section class="file-panel">
      <div>
        <h2 class="file-name" id="fileName">-</h2>
        <div class="file-meta">
          <span class="pill" id="fileType">未知类型</span>
          <span class="pill" id="fileSize" hidden></span>
          <span class="pill" id="storageHint">本地预览</span>
        </div>
      </div>
    </section>

    <main class="viewer-wrap">
      <div class="viewer" id="viewer">
        <div class="status">
          <div class="spinner"></div>
          <strong>正在加载预览</strong>
          <span>请稍候</span>
        </div>
      </div>
    </main>
  </div>

  <script src="/preview-parsers.js?v=aa7f1a3eb0"></script>
    <script src="/preview-app.js?v=5d79f3ea95"></script>
  <!-- 图标子集与渲染器放在 body 末尾（与其它页一致）：主题切换按钮的
       月亮/太阳图标靠它渲染，放 <head> 会挡住首帧。icons.js 在
       DOMContentLoaded 时自动扫描 data-lucide 并替换成 SVG。 -->
  <script src="/icons-subset.js?v=d8aaa459ac"></script>
  <script src="/icons.js?v=fc3fc216e0"></script>
</body>
</html>
