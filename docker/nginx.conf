server {
  listen 8080;
  listen [::]:8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Hard backstop for request bodies. Keep this just above UPLOAD_MAX_SIZE so the
  # app still answers oversized uploads with its own JSON 413, while anything
  # larger (including chunked bodies that carry no Content-Length) is rejected
  # before it can reach the Node process. A large value here is dangerous: the
  # upload path buffers the whole body in memory.
  client_max_body_size 108m;

  # Compress the text assets. The pages ship unminified CSS/JS (there is no build
  # step), so this is where most of the transfer win comes from: index.css alone
  # goes from 54 KB to roughly 10 KB. gzip_proxied/gzip_vary keep it correct
  # behind a CDN. Images and fonts are already compressed, so they are left out.
  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_proxied any;
  gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/manifest+json
    image/svg+xml;

  # Versioned static assets. scripts/stamp-asset-versions.cjs stamps a content
  # hash into every local CSS/JS reference, so a changed file means a changed URL
  # and a year of immutable caching is safe. This block must stay above
  # `location /` or try_files answers first and the headers never apply.
  location ~* \.(?:css|js|svg|woff2?|ttf|eot)$ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff";
    access_log off;
    try_files $uri =404;
  }

  # Icons and logo are referenced at fixed paths (favicon links, apple-touch-icon),
  # so they carry no version string. One day plus revalidation means replacing
  # them takes effect within a day instead of a year.
  location ~* ^/(?:favicon\.ico|logo\.(?:png|webp))$ {
    expires 1d;
    add_header Cache-Control "public, max-age=86400, must-revalidate";
    access_log off;
    try_files $uri =404;
  }

  # HTML must always revalidate: it carries the hashed asset URLs, so a stale page
  # would keep pointing at old assets. no-cache still allows 304s.
  location ~* \.html$ {
    add_header Cache-Control "public, no-cache";
    add_header X-Content-Type-Options "nosniff";
    add_header X-Frame-Options "DENY";
    add_header Referrer-Policy "strict-origin-when-cross-origin";
    try_files $uri /index.html;
  }

  # ^~：文件 ID 可以以 .html 等扩展名结尾（/api/manage/delete/<id>.html），
  # 不加 ^~ 时下方的静态资源正则会把这些 API 路径接走并 404——与 /file/ 的
  # 优先级坑同源，生产实测复现（2026-10-17）。
  location ^~ /api/ {
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /upload {
    # Match Cloudflare Pages behavior: GET/HEAD render the root upload UI,
    # while POST remains the upload API endpoint.
    if ($request_method = GET) {
      rewrite ^ /index.html last;
    }
    if ($request_method = HEAD) {
      rewrite ^ /index.html last;
    }

    proxy_pass http://127.0.0.1:8787/upload;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # ^~: nginx 的正则 location 优先级高于普通前缀 location。少了它，
  # /file/<id>.<图片后缀> 会被下面那条静态资源 404 规则接走，整个图库
  # 全挂 —— 而 .mp4 因为不在正则列表里幸免，看起来像「只有图片坏了」。
  # 裸机 vhost 把这个坑踩实过一次（2026-10-14）：Node 直连 /file/<id>.avif
  # 返回 200 image/avif，经过 nginx 变 404。文件 ID 以真实扩展名结尾是
  # 设计如此（gallery 用 /file/<name> 取图），所以必须让 /file/ 赢。
  location ^~ /file/ {
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /share/ {
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /s/ {
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Root and the SPA fallback both end up serving HTML from here, so they need the
  # same revalidation policy as the `.html$` block above.
  location / {
    add_header Cache-Control "public, no-cache";
    add_header X-Content-Type-Options "nosniff";
    add_header X-Frame-Options "DENY";
    add_header Referrer-Policy "strict-origin-when-cross-origin";
    try_files $uri $uri/ /index.html;
  }
}
