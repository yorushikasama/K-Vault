<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WebDAV 上传中心 | K-Vault</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="stylesheet" href="/theme.css?v=55e76fa69d" />
    <script src="/theme-core.js?v=4cb852886e"></script>
    <script defer src="/theme-effects.js?v=9dbb416bad"></script>
    <link rel="stylesheet" href="/webdav.css?v=6ed5f131ab">
    <link rel="stylesheet" href="/workspace-header.css?v=194c0fdf21" />
    <link rel="stylesheet" href="/mobile-refactor.css?v=545252aefa" />
  </head>
  <body class="kv-workbench kv-webdav">
    <!-- 头部：与上传/文件工作台共用同一套标签导航（workspace-header.css） -->
    <header class="workspace-header">
      <a class="workspace-brand" href="./" aria-label="K-Vault WebDAV">
        <img src="/logo.png" alt="" width="30" height="30" /><span>K-Vault</span>
      </a>
      <nav class="workspace-nav" aria-label="全局导航">
        <a href="./">上传</a>
        <a href="./admin.html">文件</a>
        <a href="./gallery.html">图库</a>
        <a href="./webdav.html" aria-current="page">WebDAV</a>
      </nav>
      <div class="workspace-tools">
        <button type="button" class="workspace-tool" data-theme-toggle aria-label="切换主题">
          <i data-lucide="moon" data-theme-icon></i>
          <span data-theme-label>夜间</span>
        </button>
      </div>
    </header>
    <main class="page">
      <section class="layout">
        <article class="toolbar-row">
          <div class="toolbar-left">
            <div class="status-pill" id="statusPill">
              <span class="status-dot"></span>
              <span id="statusText">正在检测 WebDAV 状态...</span>
            </div>
            <div class="status-pill">
              <i data-lucide="folder-tree"></i>
              <span id="folderPathPreview">当前目录：根目录</span>
            </div>
          </div>
          <div class="toolbar-right">
            <button id="copyAllBtn" type="button">复制全部链接</button>
            <button id="clearResultBtn" type="button" class="btn-danger">清空记录</button>
          </div>
        </article>

        <article class="card">
          <div class="card-header">
            <div>
              <h2><i data-lucide="info"></i> WebDAV 状态</h2>
              <p class="card-sub">用于确认 WebDAV 配置和连接情况。</p>
            </div>
            <button id="refreshStatusBtn" type="button"><i data-lucide="rotate-cw"></i> 刷新状态</button>
          </div>
          <p id="statusDetailText" class="status-line">等待检测</p>
        </article>

        <article class="card">
          <div class="card-header">
            <div>
              <h2><i data-lucide="folder-open"></i> 上传目录</h2>
              <p class="card-sub">可填写多级目录，例如：项目A/一月。</p>
            </div>
          </div>
          <label class="input-label" for="folderPathInput">目录路径</label>
          <div class="row">
            <input id="folderPathInput" type="text" placeholder="留空则上传到根目录" />
          </div>
          <p class="hint">后台可继续移动目录，已生成直链不会受影响。</p>
        </article>

        <article class="card">
          <div class="card-header">
            <div>
              <h2><i data-lucide="cloud-upload"></i> 文件上传</h2>
              <p class="card-sub">支持批量上传到 WebDAV。</p>
            </div>
          </div>
          <div class="upload-file-row">
            <div class="file-picker" id="filePickerBox" role="button" tabindex="0" aria-label="选择或拖拽文件">
              <input id="fileInput" class="file-input-native" type="file" multiple />
              <button id="chooseFileBtn" type="button" class="file-choose-btn">
                <i data-lucide="folder-open"></i>
                <span>选择文件</span>
              </button>
              <div class="file-picker-meta">
                <div id="filePickerTitle" class="file-picker-title">未选择任何文件</div>
                <div id="filePickerHint" class="file-picker-hint">支持多选、拖拽到此区域，上传后自动记录直链</div>
              </div>
              <span id="fileCountBadge" class="file-count-badge">0 个</span>
            </div>
            <button id="uploadFilesBtn" type="button" class="btn-primary">开始上传</button>
          </div>
          <div id="fileQueueWrap" class="file-queue-wrap">
            <div class="file-queue-head">
              <span class="file-queue-title"><i data-lucide="list"></i> 待上传队列</span>
              <button id="clearQueueBtn" type="button" class="file-queue-clear">清空队列</button>
            </div>
            <ul id="fileQueueList" class="file-queue-list"></ul>
          </div>
        </article>

        <article class="card">
          <div class="card-header">
            <div>
              <h2><i data-lucide="link"></i> URL 上传</h2>
              <p class="card-sub">输入文件地址，服务器将自动拉取并上传。</p>
            </div>
          </div>
          <div class="row">
            <input id="urlInput" type="text" placeholder="https://example.com/file.zip" />
            <button id="uploadUrlBtn" type="button" class="btn-primary">上传 URL</button>
          </div>
        </article>

        <article class="card span-2">
          <div class="card-header">
            <h2><i data-lucide="list-checks"></i> 上传结果</h2>
            <div class="result-tools">
              <span id="resultCount" class="card-sub">0 条</span>
            </div>
          </div>
          <div id="resultEmpty" class="result-empty">暂无上传结果，完成上传后将显示在这里。</div>
          <ul id="resultList" class="result-list"></ul>
        </article>
      </section>
    </main>

    <script src="/kv-shared.js?v=5901ac7854"></script>
    <script src="/webdav-app.js?v=2364cf0aa7"></script>
    <script src="/icons-subset.js?v=a139a660aa"></script>
    <script src="/icons.js?v=fc3fc216e0"></script>
</body>
</html>
