<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 | K-Vault</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="apple-touch-icon" href="/logo.png">
  <link rel="shortcut icon" href="/favicon.ico">
  <link rel="stylesheet" href="/theme.css">
  <script src="/theme.js?v=20260305"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/lucide@1.49.0/dist/umd/lucide.min.js"></script>
  <link rel="stylesheet" href="/login.css">
  <link rel="stylesheet" href="/mobile-refactor.css">
</head>
<body class="login-page">
  <!-- 背景图层 (通过JS动态控制) -->
  <div class="bg-image-layer" id="bgImageLayer" style="display: none;"></div>
  <div class="bg-overlay" id="bgOverlay" style="display: none;"></div>
  
  <div class="login-container">
    <div class="login-card">
      <div class="logo">
        <i data-lucide="cloud-upload"></i>
      </div>
      <h1 class="title">K-Vault</h1>
      <p class="subtitle">请登录以继续使用文件托管服务</p>

      <div class="error-message" id="errorMessage">
        <i data-lucide="circle-alert"></i>
        <span id="errorText">用户名或密码错误</span>
      </div>

      <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label for="username">用户名</label>
          <div class="input-wrapper">
            <i data-lucide="user"></i>
            <input type="text" id="username" class="form-input" placeholder="请输入用户名" required autofocus>
          </div>
        </div>

        <div class="form-group">
          <label for="password">密码</label>
          <div class="input-wrapper">
            <i data-lucide="lock"></i>
            <input type="password" id="password" class="form-input has-toggle" placeholder="请输入密码" required>
            <button type="button" class="password-toggle" onclick="togglePassword()">
              <i data-lucide="eye" id="passwordToggleIcon"></i>
            </button>
          </div>
        </div>

        <div class="remember-row">
          <label class="remember-label">
            <input type="checkbox" id="remember" checked>
            <span>记住登录状态</span>
          </label>
        </div>

        <button type="submit" class="login-btn" id="loginBtn">
          <i data-lucide="log-in"></i>
          <span>登 录</span>
        </button>
      </form>

      <p class="footer-text">
        Powered by <a href="https://github.com/katelya77/K-Vault" target="_blank">K-Vault</a>
      </p>
    </div>
  </div>

  <script>
    // 加载自定义背景
    (function() {
      if (
        window.UIDesignManager &&
        typeof window.UIDesignManager.syncFromServer === 'function'
      ) {
        window.UIDesignManager.syncFromServer({
          silent: true,
          applyLocalOnFailure: true
        });
        return;
      }
      const bgMode = localStorage.getItem('loginBackgroundMode') || 'gradient';
      const bgUrl = localStorage.getItem('loginBackgroundUrl') || '';
      const bgLayer = document.getElementById('bgImageLayer');
      const overlay = document.getElementById('bgOverlay');

      if (bgMode === 'image' && bgUrl) {
        bgLayer.style.backgroundImage = `url(${bgUrl})`;
        bgLayer.style.display = 'block';
        overlay.style.display = 'block';
        document.body.classList.add('has-bg-image');
      } else if (bgMode === 'bing') {
        // 使用 Bing 每日壁纸 API
        fetch('/api/bing/wallpaper/')
          .then(res => res.json())
          .then(data => {
            if (data.status && data.data && data.data.length > 0) {
              const bingUrl = 'https://cn.bing.com' + data.data[0].url;
              bgLayer.style.backgroundImage = `url(${bingUrl})`;
              bgLayer.style.display = 'block';
              overlay.style.display = 'block';
              document.body.classList.add('has-bg-image');
            }
          })
          .catch(err => console.log('Bing wallpaper fetch failed:', err));
      }
    })();

    // 页面加载时检查认证状态
    (async function() {
      try {
        const response = await fetch('/api/auth/check');
        const data = await response.json();
        
        if (!data.authRequired) {
          // 不需要认证，直接跳转
          redirectToTarget();
          return;
        }
        
        if (data.authenticated) {
          // 已认证，跳转到目标页面
          redirectToTarget();
        }
      } catch (e) {
        console.error('Auth check failed:', e);
      }
    })();

    function redirectToTarget() {
      const params = new URLSearchParams(window.location.search);
      let redirect = params.get('redirect') || '/';
      
      // 防止重定向到登录页本身，避免无限循环
      if (redirect.includes('login.html') || redirect === '/login') {
        redirect = '/';
      }
      
      // 使用 replace 防止用户回退到登录页
      window.location.replace(redirect);
    }

    function togglePassword() {
      const passwordInput = document.getElementById('password');
      const icon = document.getElementById('passwordToggleIcon');

      // Lucide replaces the <i> with an <svg>, so swap the icon by rewriting
      // the placeholder and re-running the converter.
      const nextIcon = passwordInput.type === 'password' ? 'eye-off' : 'eye';
      passwordInput.type = passwordInput.type === 'password' ? 'text' : 'password';
      icon.setAttribute('data-lucide', nextIcon);
      icon.classList.remove('lucide', 'lucide-eye', 'lucide-eye-off');
      window.KVIcons.render(icon.parentNode);
    }

    function showError(message) {
      const errorDiv = document.getElementById('errorMessage');
      const errorText = document.getElementById('errorText');
      errorText.textContent = message;
      errorDiv.classList.add('show');
    }

    function hideError() {
      document.getElementById('errorMessage').classList.remove('show');
    }

    function setLoading(loading) {
      const btn = document.getElementById('loginBtn');
      if (loading) {
        btn.disabled = true;
        btn.innerHTML = '<div class="spinner"></div><span>登录中...</span>';
      } else {
        btn.disabled = false;
        btn.innerHTML = window.KVIcons.markup('log-in') + '<span>登 录</span>';
        window.KVIcons.render(btn);
      }
    }

    async function handleLogin(event) {
      event.preventDefault();
      hideError();
      
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      
      if (!username || !password) {
        showError('请输入用户名和密码');
        return;
      }
      
      setLoading(true);
      
      try {
        const response = await fetch('/api/auth/login', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ username, password })
        });
        
        const data = await response.json();
        
        if (data.success) {
          // 登录成功，跳转
          redirectToTarget();
        } else {
          showError(data.message || '登录失败');
          setLoading(false);
        }
      } catch (error) {
        console.error('Login error:', error);
        showError('网络错误，请稍后重试');
        setLoading(false);
      }
    }

    // 回车键提交
    document.getElementById('password').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') {
        document.getElementById('loginForm').dispatchEvent(new Event('submit'));
      }
    });
  </script>
  <script src="/icons.js"></script>
</body>
</html>
